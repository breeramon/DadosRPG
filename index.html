    <!-- Fonte "Montserrat" — única fonte usada no projeto inteiro (título,
         texto normal, botões, abas, pentagrama de atributos), carregada
         aqui globalmente pra padronizar a tipografia em todas as telas.
         Antes o projeto usava Cinzel só em alguns lugares (abas, botões,
         pentagrama) e a fonte padrão do sistema no resto — essa mistura
         foi o que motivou a troca pra uma fonte só em tudo. Pesos:
         400/500 pro texto e botões comuns, 600/700/800 pros títulos,
         abas e números do pentagrama (que antes eram bold em Cinzel). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
