<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Ordem Paranormal — Meus Personagens</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Ver o comentário sobre o importmap em index.html — precisa ser
         idêntico em toda página que carrega javascript/firebase.js. -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>

    <!-- ============== LISTA DE PERSONAGENS ============== -->
    <div id="screen-characters" class="screen">
        <div class="characters-panel">
            <div class="characters-header">
                <h2>Meus Personagens</h2>
                <div class="characters-header-actions">
                    <button class="btn-action" id="btn-novo-personagem">+ Novo Personagem</button>
                    <button class="btn-secondary" id="btn-logout">Sair</button>
                </div>
            </div>

            <div id="characters-empty" class="characters-empty hidden">
                Você ainda não criou nenhum personagem.
            </div>

            <div id="characters-list" class="characters-list"></div>
        </div>
    </div>

    <script type="module" src="javascript/firebase.js"></script>
    <script src="javascript/auth-guard.js" defer></script>
    <script src="javascript/characters-list.js" defer></script>
</body>
</html>
