<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Ordem Paranormal — Entrar</title>
    <link rel="stylesheet" href="css/style.css">

    <!--
      Mapa de importação do Firebase. Alguns arquivos do SDK do Firebase
      (auth/firestore) fazem referências internas ao pacote "firebase/app"
      por esse nome "curto" em vez da URL completa — sem isso, o navegador
      não sabe pra onde apontar e quebra com o erro
      "Failed to resolve module specifier 'firebase/app'".
      Se você atualizar a versão em javascript/firebase.js, atualize aqui
      também (os dois precisam apontar pra mesma versão) — e nas outras 3
      páginas (characters.html, form.html, sheet.html), que têm o mesmo
      mapa de importação porque cada uma carrega firebase.js de novo.
    -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>

    <!-- ============== LOGIN / CADASTRO ==============
         Esta é a página de entrada do app (index.html). Se o usuário já
         estiver logado (sessão salva pelo Firebase), auth.js manda ele
         direto pra characters.html sem nem mostrar este formulário. -->
    <div id="screen-login" class="screen">
        <div class="auth-card">
            <h2>Ficha Ordem Paranormal</h2>
            <p class="auth-subtitle">Entre com sua conta para ver seus personagens.</p>

            <div id="auth-error" class="auth-error hidden"></div>

            <form id="form-auth">
                <div class="control-group full">
                    <label>E-mail</label>
                    <input type="email" id="auth-email" required autocomplete="email">
                </div>
                <div class="control-group full">
                    <label>Senha</label>
                    <input type="password" id="auth-senha" required minlength="6" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-action full" id="btn-auth-submit">Entrar</button>
            </form>

            <p class="auth-toggle">
                <span id="auth-toggle-text">Ainda não tem conta?</span>
                <a href="#" id="auth-toggle-link">Criar conta</a>
            </p>
        </div>
    </div>

    <script type="module" src="javascript/firebase.js"></script>
    <script src="javascript/auth.js" defer></script>
</body>
</html>
