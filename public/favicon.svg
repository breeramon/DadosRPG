<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glowD20v2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a0d0d" stop-opacity="1" />
      <stop offset="70%" stop-color="#1a0505" stop-opacity="1" />
      <stop offset="100%" stop-color="#121212" stop-opacity="1" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="#121212" />
  <circle cx="32" cy="32" r="31" fill="url(#glowD20v2)" />

  <!-- Mesma silhueta "gema" (hexágono alongado) da última versão, mas
       agora com 6 facetas em vez de 3 — mais fiel a um d20 de verdade
       (várias faces triangulares visíveis) em vez de parecer um cubo
       comum, mantendo linhas grossas o bastante pra não virar bagunça
       em 16px. -->
  <g stroke="#100a1a" stroke-width="1.3" stroke-linejoin="round">
    <polygon points="32,6 11.22,30 52.78,30" fill="#d9cdf0" />
    <polygon points="32,6 11.22,18 11.22,30" fill="#b39ddb" />
    <polygon points="32,6 52.78,18 52.78,30" fill="#b39ddb" />
    <polygon points="11.22,30 52.78,30 32,54" fill="#9163c9" />
    <polygon points="11.22,30 11.22,42 32,54" fill="#6e35ab" />
    <polygon points="52.78,30 52.78,42 32,54" fill="#57268e" />
  </g>

  <!-- contorno externo, por cima, mais grosso pra dar aquele acabamento
       de "adesivo" da referência -->
  <polygon
    points="32,6 52.78,18 52.78,42 32,54 11.22,42 11.22,18"
    fill="none"
    stroke="#100a1a"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
</svg>
